<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body draggable="false">

    
    <!-- کارت اصلی شیشه‌ای -->
    <div id="box">
        
        <!-- هدر (لوگو و متن) -->
        <div id="header">
            <h1 aria-label="WELCOME BACK"><span>W</span><span>E</span><span>L</span><span>C</span><span>O</span><span>M</span><span>E</span><span aria-hidden="true">
                <span style="visibility:hidden;">-</span>
                 </span><span>B</span><span>A</span><span>C</span><span>K</span></h1>
        </div>

        <!-- بخش فیلدها -->
        <div id="wrapper">
            
            <!-- فیلد ایمیل -->
            <div class="input-group">
                <input type="text" placeholder=" " id="username">
                <label for="username">Enter your Username: 
                </label>
                
            </div>

            <!-- فیلد پسورد -->
            <div class="input-group">
                <input type="password" placeholder=" " id="password">
                <label for="password">Enter your Password:</label>
                
            </div>
            <div id="login">
                  <button style="width: 100%; height: 50px; border-radius: 12px;
                  background-color: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer;font-size: 1.2rem;transition: all 0.3s ease-in-out;
                  transform: translateY(0);">Login</button>
            </div>

        </div>
        <p id="forgot-password">Forgot Password?</p>
        <p id="no-acc">Don't have an account?</p>
        <h1 id="login-with">Login with:</h1>

        <!-- دکمه‌ها -->
        <div class="buttons">
            <button id="register"> <img id="logos" draggable="false" src="photos/google-icon-1.svg" alt=""></button>
            
            <button id="register"><img id="logos" draggable="false" src="photos/github-icon-2.svg" alt=""></button>
           <button id="register"><img id="logos" draggable="false" src="photos/Apple_Logo_0.svg" alt=""></button>

           <button id="register"><img id="logos" draggable="false" src="photos/Twitter-X--Streamline-Bootstrap.svg" alt=""></button> 
            
            
          
            


        </div>

    </div>

</body>
</html>
